[package]
name = "rnaseq-standard-flow"
kind = "flow"
version = "0.3.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/rnaseq-standard-flow"

[command]
name = "taf-rnaseq-standard-flow"

[runtime]
pipe = false
command_mode = false

[meta]
domain = "bio"
categories = ["rna-seq", "standard", "workflow", "transcriptomics", "report"]
keywords = ["rnaseq-standard-flow", "rna-seq", "salmon", "hisat2", "featurecounts", "deseq2", "enrichment", "report", "transcriptomics", "denovo", "trinity", "diamond"]
description = "TAFFISH RNA-seq standard flow that composes the published RNA-seq subflows into a default reference Salmon-first route, an optional HISAT2/featureCounts branch, and an explicit de novo route."

[upstream]
name = "rnaseq-standard-flow"
type = "taffish-flow"
homepage = "https://github.com/taffish/rnaseq-standard-flow"
version = "0.3.0"
license = "Apache-2.0"
description = "TAFFISH-maintained RNA-seq umbrella flow composed from version-pinned TAFFISH RNA-seq subflow apps."

[dependencies]
taf-rnaseq-index-flow = "0.2.0-r1"
taf-rnaseq-expression-flow = "0.2.0-r1"
taf-rnaseq-alignment-flow = "0.2.0-r1"
taf-rnaseq-alignment-qc-flow = "0.2.0-r1"
taf-rnaseq-count-flow = "0.2.0-r1"
taf-rnaseq-denovo-assembly-flow = "0.2.0-r1"
taf-rnaseq-denovo-expression-flow = "0.2.0-r1"
taf-rnaseq-denovo-annotation-flow = "0.2.0-r1"
taf-rnaseq-de-flow = "0.2.0-r1"
taf-rnaseq-enrichment-flow = "0.2.0-r1"
taf-rnaseq-report-flow = "0.3.0-r2"
